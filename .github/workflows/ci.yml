name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    name: Messages de commit (conventional commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vérifie les commits ajoutés
        env:
          AVANT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          APRES: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Nouvelle branche (pas de commit précédent connu) : seul le dernier commit est vérifié.
          if [ -z "$AVANT" ] || ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; then AVANT="$APRES~1"; fi
          npx commitlint --from "$AVANT" --to "$APRES" --verbose

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validation des données (schémas, sources, identifiants)
        run: npm run data:validate
      - name: Les fichiers de derive/ sont à jour
        run: npm run derive:check
      - name: Le paquet de données de l'application est à jour
        run: npm run bundle:check
      - name: Les types générés sont à jour
        run: npm run types:check
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Compilation
        run: npm run build
      - name: Navigateur pour les tests de bout en bout
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout et accessibilité (site construit, écran de téléphone)
        run: npm run e2e
