name: Contester une position codée
description: Un code, une nature ou un extrait paraît erroné pour un candidat sur une question. Une source publique est obligatoire.
title: "[Position] <candidat> × <question>"
labels: ["contestation", "position"]
body:
  - type: markdown
    attributes:
      value: |
        ## Avant de commencer

        Les positions codées sont publiques et contestables. Une contestation est examinée selon la [grille de codage](https://github.com/Mathieu-Pasco-Breillot/boussole-2027/blob/develop/docs/grille-codage.md) (§ 5 et § 6).

        **Exigences**

        - **Une source publique est obligatoire.** Une contestation sans source est refusée.
        - **Sources admises** (§ 5) : programme officiel 2027 du candidat ; texte signé par le candidat (livre, tribune, proposition de loi dont il est premier signataire) ; discours ou déclaration publique rapportée par un média national, entretien ; programme du parti, uniquement si le candidat en est investi et pour un texte adopté après son investiture.
        - **Sources non admises** : source non publique ; source antérieure au 1er janvier 2022 ; agrégateur ou analyse tierce ; inférence depuis l'étiquette, le parti, les alliés ou les positions passées du parti ; programme d'un parti dont le candidat n'est pas investi ; vote parlementaire (les votes ne servent pas au codage, § 5).
        - **Citation de 14 mots au plus**, exacte, retrouvée mot à mot dans la page source.
        - **Le code est relatif à l'énoncé de la question tel qu'il est écrit**, jamais à un camp ni à un axe (§ 1). Une question formulée à rebours (« Il ne faut pas… ») se code toujours par rapport à son énoncé.
        - **Valeur sur l'échelle de −2 à +2** (§ 2), en tenant compte des règles d'application R1 à R6. Un 0 n'est jamais un code par défaut.
        - **Nature** : `nette`, `nuancee`, `imprecise` ou `non_connu` (§ 3).
        - **Sources contradictoires** : deux sources contradictoires à moins de six mois d'écart conduisent à la nature `imprecise` ; entre deux sources de dates différentes, la plus récente l'emporte.
        - **Un seul candidat et une seule question par issue.**

        ## Critères d'acceptation

        **Contestation** (grille de codage, § 6.6) : issue GitHub avec source. Un code n'est modifié que sur présentation d'un extrait admissible au sens du § 5.

        **Pour être recevable**, l'issue contient une source publique et datée d'un type admis, un extrait de 14 mots au plus retrouvable dans cette source, et une argumentation qui rattache l'extrait à l'énoncé de la question.

        **Si la contestation est recevable** :

        1. la position est recodée sur la source la plus récente, et l'ancien code est archivé (méthodologie, § 9) ;
        2. la version de la position augmente de 1 ;
        3. une entrée de type `recodage` est ajoutée à `data/journal.json` ;
        4. `npm run check` doit passer.

        **Sinon**, l'issue est close avec le motif : position maintenue, ou contestation irrecevable.
